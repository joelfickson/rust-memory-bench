name: ci

on:
  push:
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Allocation tests
        run: cargo test --release --manifest-path rust/Cargo.toml
      - name: Quick benchmark with checksum verification
        run: node harness/bench.ts --quick --out results/ci-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: results-linux-x64
          path: results/ci-linux-x64
